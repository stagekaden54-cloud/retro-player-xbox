name: Build Xbox UWP package

on:
  push:
    branches: [xbox-native-shell]
    paths:
      - "XboxShell/**"
      - ".github/workflows/build-xbox-uwp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install UWP build workload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Workload.Universal --includeRecommended --quiet --norestart --wait
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore XboxShell/RetroPlayerXbox.sln

      - name: Generate package logo assets
        shell: pwsh
        run: ./XboxShell/GenerateAssets.ps1

      - name: Create temporary development signing certificate
        shell: pwsh
        run: |
          $passwordText = [Guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=RetroPlayerXbox" -KeyUsage DigitalSignature -FriendlyName "Retro Player Xbox CI" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfxPath = Join-Path $env:RUNNER_TEMP "RetroPlayerXbox.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "RetroPlayerXbox.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CER_PATH=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PFX_PASSWORD=$passwordText" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed x64 app package
        shell: pwsh
        run: |
          msbuild XboxShell/RetroPlayerXbox.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxPackage=true /p:AppxBundle=Never /p:AppxPackageSigningEnabled=true /p:UapAppxPackageBuildMode=SideloadOnly /p:PackageCertificateKeyFile="$env:PFX_PATH" /p:PackageCertificatePassword="$env:PFX_PASSWORD"

      - name: Stage public development certificate
        shell: pwsh
        run: |
          $packageDir = "XboxShell/bin/x64/Release/AppPackages"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "$env:CER_PATH" (Join-Path $packageDir "RetroPlayerXbox.cer")

      - name: Upload Xbox package and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: retro-player-xbox-uwp-x64
          path: XboxShell/bin/x64/Release/AppPackages/**/*
          if-no-files-found: error
          retention-days: 14
