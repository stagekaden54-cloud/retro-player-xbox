name: Web client validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required settings elements
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const ids=['settings-dialog','open-settings','tv-mode-toggle','large-interface-setting','reduce-motion-setting','settings-game-count','settings-storage-used']; for (const id of ids) { if (!html.includes('id=\"'+id+'\"')) throw new Error('Missing required element: '+id); }"

      - name: Verify performance update safeguards
        run: |
          node -e "const fs=require('fs'); const app=fs.readFileSync('app.js','utf8'); const html=fs.readFileSync('index.html','utf8'); const shell=fs.readFileSync('XboxShell/MainPage.xaml.cs','utf8'); const checks=[['paged library',app.includes('PERSONAL_PAGE_SIZE = 24') && html.includes('personal-load-more')],['cached IndexedDB reads',app.includes('getPersonalEntries()') && app.includes('cachedPersonalEntries')],['optional performance monitor',app.includes('window.EJS_ready=function') && app.includes('samplePerformanceFrame') && html.includes('performance-panel')],['native input batching',app.includes('RetroPlayerNativeInputBatch') && shell.includes('SendActionsAsync(actions)')],['native host stops browser dashboard poll',app.includes('if(window.RetroPlayerNativeHost||document.hidden)return;')]]; for(const [name,ok] of checks){if(!ok)throw new Error('Performance check failed: '+name)}"
      - name: Verify PS1 and Nintendo 64 emulator mapping
        run: |
          node -e "const fs=require('fs'); const app=fs.readFileSync('app.js','utf8'); const required=[\"window.EJS_core=isN64?'n64':'psx'\",\"n64Extensions=['z64','n64','v64']\",\"ps1Extensions=['bin','iso','img','pbp','chd']\"]; for (const item of required) { if (!app.includes(item)) throw new Error('Missing emulator support: '+item); }"
